name: Plugin CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

# Preserve CI evidence for every direct-to-main commit by never cancelling main runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Lua and LuaCC
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacc

      - name: Run lint
        run: make lint

      - name: Run unit tests
        run: make test-unit

      - name: Build plugin
        run: make build

      - name: Validate bundled file
        run: |
          lua -e "assert(loadfile('dist/seerr-notification/seerr-notification.lua'))"
          echo "✅ Bundle syntax valid"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-build
          path: dist/seerr-notification/
          retention-days: 14

  integration-tests:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: plugin-build
          path: dist/seerr-notification

      - name: Setup Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run integration tests
        run: make test-integration
        env:
          SKIP_BUILD: "true"


